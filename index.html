<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Product 1 -->
        <div class="product-card">

            <div class="image-box">
                <img src="Headphone.jpeg"
                     alt="Wireless Headphones">
            </div>

            <h2>Wireless Headphones</h2>

            <p>
                High-quality wireless headphones
                with excellent sound.
            </p>

            <div class="price">₹69,999</div>

            <button>Buy Now</button>

        </div>


        <!-- Product 2 -->
        <div class="product-card">

            <div class="image-box">
                <img src="Watch.jpeg"
                     alt="Smart Watch">
            </div>

            <h2>Smart Watch</h2>

            <p>
                Track your fitness, notifications
                and daily activities.
            </p>

            <div class="price">₹74,499</div>

            <button>Buy Now</button>

        </div>


        <!-- Product 3 -->
        <div class="product-card">

            <div class="image-box">
                <img src="Camera.png"
                     alt="Digital Camera">
            </div>

            <h2>Digital Camera</h2>

            <p>
                Capture your best moments with
                this powerful camera.
            </p>

            <div class="price">₹20,999</div>

            <button>Buy Now</button>

        </div>

    </div>

</body>
</html>
